<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="24" y="24" width="592" height="392" rx="14" fill="#edf0f2" stroke="#9aa3ab" stroke-width="1.5"/>
  <text x="42" y="54" font-size="20" fill="#6b7178">&#937;</text>

  <!-- two disjoint circles: they do not touch -->
  <circle cx="195" cy="240" r="112" fill="#f3c1d3" fill-opacity="0.55"/>
  <circle cx="445" cy="240" r="112" fill="#b6ddd7" fill-opacity="0.55"/>
  <circle cx="195" cy="240" r="112" fill="none" stroke="#cf7a99" stroke-width="2.5"/>
  <circle cx="445" cy="240" r="112" fill="none" stroke="#4f9e94" stroke-width="2.5"/>

  <text x="195" y="100" font-size="19" fill="#c05680" font-weight="bold" text-anchor="middle">Odd = {1, 3, 5}</text>
  <text x="445" y="100" font-size="19" fill="#3f8a80" font-weight="bold" text-anchor="middle">Even = {2, 4, 6}</text>

  <!-- odd outcomes -->
  <text x="195" y="200" font-size="25" fill="#20242a" text-anchor="middle">1</text>
  <text x="158" y="292" font-size="25" fill="#20242a" text-anchor="middle">3</text>
  <text x="232" y="292" font-size="25" fill="#20242a" text-anchor="middle">5</text>
  <!-- even outcomes -->
  <text x="445" y="200" font-size="25" fill="#20242a" text-anchor="middle">2</text>
  <text x="408" y="292" font-size="25" fill="#20242a" text-anchor="middle">4</text>
  <text x="482" y="292" font-size="25" fill="#20242a" text-anchor="middle">6</text>

  <text x="320" y="404" font-size="16" fill="#555555" text-anchor="middle" font-style="italic">Odd &#8745; Even = &#8709;   (no shared outcomes &#8212; the circles never touch)</text>
</svg>
